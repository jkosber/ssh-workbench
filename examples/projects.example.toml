# Supported schema for ssh_workbench.config.load_projects(Path(...)).
# The CLI and screen do not load configuration yet; see README.md.
# All names, SSH aliases, repository locations and links below are fictional.
# Private configuration belongs in .local/projects.toml, outside Git.

schema_version = 1

[[projects]]
id = "garden-demo"
name = "Garden demo"
ssh_alias = "garden-demo-host"
repository = "https://example.com/fictional/garden-demo.git"
documentation = "https://example.com/fictional/garden-demo/docs"
